# Local development environment (not production — prod runs on Mikrus).
# Usage (from repo root):
#   docker compose -f deploy/dev/compose.yml --env-file .env up -d
#   docker compose -f deploy/dev/compose.yml --env-file .env --profile jobs run --rm ingest hevy
#   docker compose -f deploy/dev/compose.yml --profile tools run --rm go go version

name: forma-dev

x-database-url: &database-url postgres://${POSTGRES_USER:-forma}:${POSTGRES_PASSWORD:-forma_dev}@postgres:5432/${POSTGRES_DB:-forma}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forma}
      POSTGRES_USER: ${POSTGRES_USER:-forma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma_dev}
      TZ: Europe/Warsaw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs pending migrations on every `up`, then exits.
  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database", *database-url, "up"]
    volumes:
      - ../../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Ingest workers, run on demand: `run --rm ingest {hevy|garmin|garmin-login}`.
  ingest: &ingest
    build:
      context: ../../services/ingest
      target: dev
    profiles: ["jobs"]
    environment:
      DATABASE_URL: *database-url
      HEVY_API_KEY: ${HEVY_API_KEY:-}
      FORMA_SECRETS_KEY: ${FORMA_SECRETS_KEY:-}
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMINTOKENS: /data/garmin
      FITATU_EMAIL: ${FITATU_EMAIL:-}
      FITATU_SESSION: /data/fitatu/session.json
      TZ: Europe/Warsaw
    volumes:
      - ../../services/ingest:/app
      - garmin_tokens:/data/garmin
      - fitatu_session:/data/fitatu
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Hourly Garmin + Hevy sync, Hevy -> Garmin set export, 3:00 backfill and on-demand syncs from sync_request (services/ingest/ingest/scheduler.py).
  scheduler:
    <<: *ingest
    profiles: []
    command: ["schedule"]
    restart: unless-stopped

  # Coach chat over Claude Agent SDK (docs/design.md, "Czat z trenerem"). Source is mounted, node --watch reloads.
  coach-chat:
    image: node:24-alpine
    working_dir: /src/services/coach-chat
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      DATABASE_URL: *database-url
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FORMA_SECRETS_KEY: ${FORMA_SECRETS_KEY:-}
      COACH_MODEL: ${COACH_MODEL:-claude-opus-5-5}
      COACH_EFFORT: ${COACH_EFFORT:-medium}
      FORMA_MCP_URL: ${FORMA_MCP_URL:-http://mcp:8091/mcp}
      FORMA_MCP_TOKEN: ${FORMA_MCP_TOKEN:-}
      CLAUDE_CONFIG_DIR: /data/claude
    volumes:
      - ../../services/coach-chat:/src/services/coach-chat
      - coach_node_modules:/src/services/coach-chat/node_modules
      - claude_config:/data/claude
      - npmcache:/root/.npm
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Dashboard API (Go): /api/today, /api/training; rebuilds projections from raw_payload every 5 min.
  # Dev runs from source (`go run`); restart the container after Go changes.
  api:
    image: golang:1.25
    working_dir: /src/services/api
    command: ["go", "run", "./cmd/api", "serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: *database-url
      PROJECT_INTERVAL: 5m
      # Stores credentials from Ustawienia (/api/settings/secrets); without it the view is read-only.
      FORMA_SECRETS_KEY: ${FORMA_SECRETS_KEY:-}
      TZ: Europe/Warsaw
    volumes:
      - ../../services/api:/src/services/api
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully

  # MCP server (Go, same module as api): the coach's only way to data, http://localhost:8091/mcp with
  # `Authorization: Bearer <token>`: the token from Ustawienia (checked by its sha256, no FORMA_SECRETS_KEY here)
  # or FORMA_MCP_TOKEN (min. 32 chars). Reads projections kept fresh by `api`.
  mcp:
    image: golang:1.25
    working_dir: /src/services/api
    command: ["go", "run", "./cmd/mcp"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      DATABASE_URL: *database-url
      FORMA_MCP_TOKEN: ${FORMA_MCP_TOKEN:-}
      TZ: Europe/Warsaw
    volumes:
      - ../../services/api:/src/services/api
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Dashboard (Vue + Vite) on http://localhost:5173, also exposed on the LAN (api and chat go through its proxy). One-off: `run --rm web npm run build`.
  web:
    image: node:24-alpine
    working_dir: /src/web
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_POLL: "1"
      VITE_API_PROXY: http://api:8080
      VITE_CHAT_PROXY: http://coach-chat:8090
    volumes:
      - ../../web:/src/web
      - web_node_modules:/src/web/node_modules
      - npmcache:/root/.npm

  # Static mockups from design/ on http://localhost:8082 (index.html, screens/*.html), also on the LAN.
  design:
    image: python:3.13-slim
    command: ["python", "-m", "http.server", "8082", "--directory", "/design"]
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ../../design:/design:ro

  # Toolchains for services/*, run on demand (profile "tools"), so nothing has to be installed on the host.
  go:
    image: golang:1.25
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - ../..:/src
      - gomod:/go/pkg/mod
    environment:
      DATABASE_URL: *database-url

  node:
    image: node:24-alpine
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - ../..:/src
      - npmcache:/root/.npm
    environment:
      DATABASE_URL: *database-url

volumes:
  pgdata:
  garmin_tokens:
  fitatu_session:
  gomod:
  gobuild:
  npmcache:
  web_node_modules:
  coach_node_modules:
  claude_config:
